<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153c36">
  <title>A-Level Atlas · 课程图谱与练习</title>
  <style>:root {
  color-scheme: light;
  --ink:#19342c; --body:#273c34; --muted:#57685d; --paper:#f6f6ee;
  --line:#cbd4c7; --green:#17483b; --lime:#eeff93;
  font:16px/1.55 "Inter",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--paper); color:var(--body);
}
* {box-sizing:border-box}
body {margin:0}
a {color:inherit;text-underline-offset:4px}
a,button,label {touch-action:manipulation}
button {font:inherit;cursor:pointer}
button:disabled {cursor:default}
:focus-visible {outline:3px solid #b04b10;outline-offset:3px}
[hidden] {display:none!important}
.sr {position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.mast {border-bottom:1px solid var(--line);background:#fbfcf4}
.mast-inner, main, footer {width:min(1110px,calc(100% - 2.6rem));margin:auto}
.mast-inner {display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:14px 0}
.wordmark {display:inline-flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-size:1.35rem;line-height:1.2;font-weight:760;letter-spacing:-.05em}
.atlas-mark {display:inline-grid;place-items:center;flex:none;width:36px;height:36px;border-radius:6px;background:#176050;color:#fff;font:600 1.16rem/1 "PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:normal}
.mast nav,footer {display:flex;align-items:center;gap:24px}
.mast nav a {font-size:.89rem;text-decoration:none;font-weight:600}
.mast nav a:hover,footer a:hover {text-decoration:underline}
.map-entry {position:relative;overflow:hidden;border-radius:18px}
.map-entry {background:#153c36;color:#fff}
.entry-content {position:relative;z-index:1;padding:26px 30px 25px}
.kicker,.progress,.task-label,.questions-nav small {font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"PingFang SC",monospace;font-variant-numeric:tabular-nums}
.kicker {font-size:.78rem;letter-spacing:.04em;margin:0 0 .55rem;font-weight:600}
.map-entry .kicker {color:#d8e4cb}
.entry-content h2 {font-size:clamp(1.65rem,3.3vw,2.65rem);letter-spacing:-.06em;line-height:1.25;margin:.5rem 0}
.entry-link {display:inline-flex;align-items:center;gap:16px;border-radius:7px;padding:7px 13px;background:var(--lime);color:#1d3828;text-decoration:none;font-weight:650;font-size:.88rem}
.entry-link:hover {background:white}
.contours {position:absolute;inset:0 0 0 auto;width:42%;opacity:.45;background:repeating-radial-gradient(ellipse at 119% 115%,transparent 0 16px,#7ba677 17px,transparent 18.5px 27px);mask-image:linear-gradient(to right,transparent,#000 32%)}
.practice {scroll-margin-top:12px}
.section-head {display:flex;align-items:end;justify-content:space-between;gap:1rem;margin:0 0 16px}
.section-head .kicker {color:var(--muted);margin-bottom:5px}
.section-head h2 {font-size:clamp(1.45rem,2.8vw,2.1rem);letter-spacing:-.055em;color:var(--ink);line-height:1.3;margin:0}
.progress {font-size:.83rem;color:var(--muted);white-space:nowrap}
.practice-grid {display:grid;grid-template-columns:minmax(160px,220px) minmax(0,1fr);gap:18px;align-items:start}
.questions-nav {display:grid;gap:3px}
.questions-nav a {display:flex;align-items:baseline;gap:9px;border-radius:8px;padding:10px 12px;text-decoration:none;font-size:.93rem}
.questions-nav a:hover {background:#edf1e5}
.questions-nav a[aria-current] {background:#dce8d9;font-weight:700}
.questions-nav small {font-size:.74rem;color:var(--muted)}
.questions-nav a[data-answered]::after {content:"";display:inline-block;margin-left:auto;width:7px;height:7px;border-radius:50%;background:#336541;align-self:center}
.questions-nav a[data-pending]::after {content:"";margin-left:auto;width:7px;height:7px;border-radius:50%;border:1px solid #99672e;align-self:center;flex:none}
.task {background:#fffffa;border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3.2vw,36px);min-width:0}
.task-label {font-size:.8rem;color:var(--muted);margin-bottom:10px}
#question {color:var(--ink);max-width:67ch;font-size:1.125rem;font-weight:400;line-height:1.6;letter-spacing:normal;margin:0 0 9px;scroll-margin-top:16px}
#question:focus:not(:focus-visible) {outline:none}
figure {margin:0 0 16px;background:#f4f7ef;border-radius:8px;padding:14px}
figure svg {display:block;width:min(100%,380px);height:auto;margin:auto}
#choices {border:0;padding:0;margin:0;min-width:0;display:grid;gap:7px}
.option {display:flex;align-items:center;gap:11px;position:relative;min-height:45px;padding:8px 12px;border:1px solid #cbd3c5;border-radius:7px;cursor:pointer;line-height:1.5}
.option:hover {border-color:#7c9582}
.option:has(input:checked) {border-color:#3e765a;background:#edf4e8;box-shadow:inset 0 0 0 1px #5c8163}
.option:has(input:focus-visible) {outline:3px solid #a2531d;outline-offset:2px}
.option input {position:absolute;opacity:0;width:1px;height:1px}
.option-letter {display:grid;place-items:center;width:27px;height:27px;flex:none;border-radius:5px;font:600 13px/1 ui-monospace,monospace;background:#edf0e7;color:#435648}
.option:has(input:checked) .option-letter {background:#25523e;color:white}
.option-text {white-space:pre-line;overflow-wrap:anywhere}
.unsure {border-style:dashed;color:var(--muted)}
.form-actions {display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:16px 0 0}
.confidence {display:flex;align-items:center;gap:7px;font-size:.9rem;cursor:pointer}
.confidence input {width:17px;height:17px;accent-color:var(--green);margin:0}
.confidence:has(input:disabled) {color:#677164;cursor:default}
#submit,.next {border:0;border-radius:7px;padding:9px 15px;font-weight:650;font-size:.92rem;background:var(--green);color:white}
#submit:disabled {background:#e1e5dc;color:#5e685c}
.feedback {margin-top:19px;padding:14px 17px;border-radius:8px;background:#f7eddc;border-left:4px solid #ab773a}
.feedback[data-outcome=correct] {background:#e8f2e5;border-color:#43825a}
.feedback h4 {margin:0 0 4px}
.feedback p {margin:4px 0}
#diagnosis {margin-top:12px;border-top:1px solid #d2c5ab;padding-top:10px;scroll-margin:16px}
#diagnosis h5 {margin:0 0 4px;font-size:1rem}
#diagnosis p {line-height:1.6}
#diagnosis small,#diagnosis a {display:block;margin:.25rem 0 .55rem;color:#40564c}
#diagnosis button {display:inline-block;padding:7px 11px;margin:6px 6px 0 0;border:1px solid #819787;border-radius:6px;background:#fff;color:var(--ink);text-align:start}
#diagnosis button:hover {background:#edf4e8}
#diagnosis button[data-action=continue],#diagnosis button[data-action=start] {color:white;background:var(--green)}
#retry-note {padding:8px 12px;border-inline-start:3px solid var(--green);color:var(--green);font-size:.93rem}
#history-content ul {padding-inline-start:20px}
#confidence-text {font-size:.85rem;color:#4d5f51}
.next {margin-top:7px;padding:4px 0;background:none;color:#24483a;text-decoration:underline;text-underline-offset:3px}
#history {margin:18px 0 32px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 6px}
summary {cursor:pointer;color:var(--ink);font-weight:650}
#history-content {padding:6px 0;overflow-wrap:anywhere}
#history-content h4 {margin:12px 0 5px}
#history-content ol {margin:0;padding-left:24px}
#history-content li {margin:.4rem 0}
#history-content p {margin:.18rem 0;color:var(--muted)}
.local-note {font-size:.85rem;color:var(--muted)}
.text-button {border:0;padding:0;background:none;color:var(--green);text-decoration:underline;text-underline-offset:3px}
footer {border-top:1px solid var(--line);padding:17px 0 28px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
footer span {margin-right:auto;font-weight:650}
@media (max-width:720px) {
  .mast-inner,main,footer {width:calc(100% - 1.45rem)}
  .mast nav {gap:12px}
  .entry-content {padding:18px 14px}
  .entry-content h2 {font-size:1.45rem}
  .entry-content .kicker {font-size:.68rem;min-height:2.1em}
  .practice-grid {grid-template-columns:1fr;gap:12px}
  .questions-nav {grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
  .questions-nav a {border:1px solid var(--line);font-size:.77rem;display:grid;gap:0;padding:4px 7px;line-height:1.4}
  .questions-nav a[data-answered]::after {display:none}
  .section-head {align-items:center;margin-bottom:11px}
  .wordmark {font-size:1.06rem}
}
@media (max-width:400px) {
  .mast nav {gap:8px}
  .mast nav a {font-size:.77rem}
  .atlas-mark {width:30px;height:30px;font-size:1rem}
  .entry-content {padding:14px}
  .entry-content .kicker {min-height:0}
  .form-actions {align-items:stretch;flex-direction:column}
  figure {padding:8px}
}

.map-entry {margin:24px 0}
.map-entry .entry-content {display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 16px}
.map-entry .kicker {grid-column:1/-1}
.map-entry h2 {margin:0}
#topics {scroll-margin-top:10px;margin:24px 0 32px}
#topics h2 {font-size:1.25rem;margin:0 0 10px}
#topic-cards {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
#topic-cards a {display:flex;flex-direction:column;align-items:start;gap:6px;background:#fffef8;border:1px solid var(--line);border-radius:10px;padding:14px;text-decoration:none}
#topic-cards a[aria-current] {background:#e8f0e3;border-color:#5b816c}
#topic-cards a:hover {border-color:#376d53}
#topic-cards small,#topic-cards span {font-size:.78rem;color:var(--muted)}
#topic-cards strong {font-size:1.02rem;color:var(--ink);line-height:1.3}
#topic-cards span {margin-top:auto}
var {font:italic 1.07em/1 Georgia,serif}
#translation {margin:0 0 18px;font-size:.86rem;color:var(--muted)}
#translation summary {cursor:pointer;width:fit-content}
#translation p {font-size:.96rem;margin:6px 0 0;max-width:64ch}
#question-figure svg {font:13px system-ui,sans-serif;color:var(--ink)}
.plot-grid {stroke:#c9d8ce;stroke-dasharray:3 3;fill:none}
.plot-axis {stroke:#374c42;stroke-width:1.6;fill:none}
.plot-line {fill:none;stroke:#176050;stroke-width:3}
#follow-up {margin:12px 0;padding:4px 12px 10px;border-inline-start:2px solid #548970}
#follow-up button {padding:5px 10px;margin:3px 8px 4px 0;border:1px solid #849b8a;border-radius:5px;background:#fff;color:var(--ink)}
@media(max-width:760px) {
  #topic-cards {grid-template-columns:repeat(2,minmax(0,1fr))}
  #question {font-size:1.0625rem}
  .mast-inner {flex-wrap:wrap}
  .questions-nav {grid-template-columns:repeat(2,minmax(0,1fr))}
}

.question-feedback {text-align:end;font-size:.84rem;color:var(--muted);margin:10px 0}
</style>
</head>

      skill: "结合交点、测试点和等号写出区间",
      prompt: "抛物线与直线在 $x$ = 1 与 $x$ = 4 处穿过彼此。$x$ = 2 时抛物线在上方。它严格高于直线的范围是？",

      explain: "测试点 2 落在两个交点之间，这一段抛物线都在上方。交点处同高，因此“严格高于”要去掉两个端点。"
    }
  ],
  "quadratics-5": [
    {
      skill: "用零乘积找区间边界",
      prompt: "($x$ − 1)($x$ + 4) 的值为零时，$x$ 可以取哪两个值？",
      choices: ["−1 和 4", "1 和 −4"], correct: 1,
      explain: "分别令每个因式为零。$x$ − 1 = 0 给出 1，$x$ + 4 = 0 给出 −4。"
    },
    {
      skill: "用因式符号判断乘积正负",
      prompt: "在 −4 < $x$ < 1 内，$x$ − 1 为负，$x$ + 4 为正。它们的乘积是什么符号？",
      choices: ["负", "正"], correct: 0,
      explain: "正数乘以负数得到负数。在这个开区间内两个因式都不等于零，所以乘积严格小于零。",
      wrongFoundation: {
        skill: "计算负数与正整数的乘积",
        prompt: "把 (−2) × 3 看作三个 (−2) 相加，结果是多少？",
        choices: ["−6", "+6"], correct: 0,
        explain: "从 0 出发，连续三次向左走 2 格，最后在 −6。乘以正整数保留了负号。"
      }
    },
    {
      skill: "从因式和端点条件求解二次不等式",
      prompt: "3$x$² − 5$x$ − 2 = (3$x$ + 1)($x$ − 2)。在哪个范围有 3$x$² − 5$x$ − 2 ≤ 0？",
      choices: ["$x$ ≤ −1/3 或 $x$ ≥ 2", "−1/3 ≤ $x$ ≤ 2"], correct: 1,
      explain: "边界是 −1/3 和 2。中间取 $x$ = 0，两个因式异号，乘积为负；外侧两因式同号。≤ 允许把乘积为零的端点也包括进来。"
    }
  ]
};

<script>
// Keep only the student's actions. Replaying them also restores an unfinished check offline.
const diagnosticProbes = { ...physicsProbes, ...edexcelProbes };

function diagnosisState(steps, actions = []) {
  let level = 1;
  let step = steps[level];
  let phase = "ask";
  const checks = [];
  const difficulties = new Map();
  for (const action of actions) {
    if (phase === "ask") {
      if (action !== "unsure" && !(Number.isInteger(action) && action >= 0 && action < step.choices.length)) break;
      const correct = action === step.correct;
      const repeated = checks.some(previous => previous.step === step);
      checks.push({level, step, choice:action, correct, repeated, still:false});
      if (!correct) difficulties.set(step,(difficulties.get(step) || 0) + 1);
      phase = "explain";
    } else if (phase === "explain") {
      const check = checks.at(-1);
      if (action !== "continue" && action !== "still") break;
      if (action === "still") {
        check.still = true;
        if (check.correct) difficulties.set(step,(difficulties.get(step) || 0) + 1);
      }
      const needsHelp = check.still || !check.correct;
      if (needsHelp && ((level === 0 && check.still) || difficulties.get(step) >= 2 || checks.length >= 8)) {
        phase = "teacher";
      } else if (level === steps.length - 1 && !needsHelp) {
        phase = "retry";
      } else {
        // At the foundation the worked explanation is available. Test its use on the next step.
        level = needsHelp && level > 0 ? level - 1 : level + 1;
        const specific = level === 0 && !check.correct && check.choice !== "unsure" && step.wrongFoundation;
        step = specific || steps[level];
        phase = "ask";
      }
    } else if (phase === "teacher" && action === "retry") {
      phase = "retry";
    } else break;
  }
  return {level, step, phase, checks};
}

</script>
<script>
(() => {
  "use strict";
  const find = (id) => document.getElementById(id);
  find("download").hidden = location.protocol === "file:";
  const keyPrefix = "alevel-atlas.";
  const idOf = (q) => q.id || q.ref;
  const storageKey = (q) => q.id ? keyPrefix + "topics.v1." + q.id : keyPrefix + "9702.capacitance.v1." + q.ref;
  let topic = studyTopics[0];
  let questions = topic.questions;
  const unsure = "unsure";
  const labels = "ABCD";
  let index = 0;
  let storageAvailable = true;
  const attempts = new Map();
  const visited = new Map();
  const retrying = new Set();

  function mathText(el, text) {
    el.replaceChildren();
    for (const [i, part] of text.split("$").entries()) {
      if (i % 2 === 0) { el.append(part); continue; }
      for (const token of part.split(/([A-Za-zΔ]+)/)) {
        if (/^[A-Za-zΔ]+$/.test(token)) {
          const variable = document.createElement("var");
          variable.textContent = token;
          el.append(variable);
        } else el.append(token);
      }
    }
  }
  function renderFigure(question) {
    const figure = find("question-figure");
    figure.replaceChildren();
    figure.hidden = !question.chart && !question.circuitSvg;
    if (question.circuitSvg) {
      // Diagrams are static drawings included by the question author.
      figure.innerHTML = question.circuitSvg;
      return;
    }
    if (!question.chart) return;
    const c = question.chart;
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns,"svg");
    svg.setAttribute("viewBox","0 0 400 224");
    svg.setAttribute("role","img");
    svg.setAttribute("aria-label", c.description);
    figure.append(svg);
    function draw(tag, attrs, text) {
      const el = document.createElementNS(ns,tag);
      for (const [name,value] of Object.entries(attrs)) el.setAttribute(name,value);
      if (text !== undefined) el.textContent = text;
      svg.append(el);
      return el;
    }
    const x = (value) => 60 + 294 * value / c.xMax;
    const y = (value) => 168 - 132 * value / c.yMax;
    for (const tick of c.xTicks) {
      draw("path", {d:"M" + x(tick) + " 36V168", class:"plot-grid"});
      draw("text", {x:x(tick),y:185,"text-anchor":"middle"}, tick);
    }
    for (const tick of c.yTicks) {
      draw("path", {d:"M60 " + y(tick) + "H354",class:"plot-grid"});
      draw("text", {x:51,y:y(tick)+4,"text-anchor":"end"},tick);
    }
    draw("path", {d:"M60 27V168H365",class:"plot-axis"});
    draw("polyline", {points:c.points.map(([a,b])=> x(a)+","+y(b)).join(" "),class:"plot-line"});
    for (const [label,attrs] of [[c.xLabel,{x:357,y:209,"text-anchor":"end"}],[c.yLabel,{x:41,y:19}]]) {
      const el = draw("text",attrs);
      const [symbol,unit] = label.split(" / ");
      const variable = document.createElementNS(ns,"tspan");
      variable.setAttribute("font-style","italic");
      variable.textContent = symbol;
      el.append(variable," / " + unit);
    }
  }

  function renderProbe(q, attempt) {
    const panel = find("follow-up");
    const probe = q.followUp;
    panel.replaceChildren();
    panel.hidden = !probe || attempt.choice !== probe.choice;
    if (panel.hidden) return;
    const prompt = document.createElement("p");
    mathText(prompt, probe.prompt);
    panel.append(prompt);
    if (Number.isInteger(attempt.probeChoice)) {
      const result = document.createElement("p");
      mathText(result, "你选了「" + probe.choices[attempt.probeChoice] + "」。" + (attempt.probeChoice === probe.correct ? "这一步正确。" : "") + probe.explanation);
      const retry = document.createElement("button");
      retry.type = "button"; retry.textContent = "回原题再试";
      retry.onclick = () => {
        retrying.add(idOf(q));
        visited.set(idOf(q), {choice:null,doubt:false});
        renderQuestion();
        find("question").focus();
      };
      panel.append(result,retry);
      return;
    }
    probe.choices.forEach((answer,i) => {
      const btn = document.createElement("button");
      btn.type = "button"; mathText(btn, answer);
      btn.onclick = () => {
        const list = storageAvailable ? readAttempts(q) : attempts.get(idOf(q));
        const last = list.at(-1);
        if (!last || last.choice !== attempt.choice || last.doubt !== attempt.doubt) {
          renderQuestion();
          return;
        }
        last.probeChoice = i;
        attempts.set(idOf(q),list);
        if (storageAvailable) {
          try { localStorage.setItem(storageKey(q),JSON.stringify(list)); }
          catch { storageAvailable = false; }
        }
        refreshOverview();
        showFeedback(q,last);
      };
      panel.append(btn);
    });
  }
  function validChoice(value, question) {
    return value === unsure || (Number.isInteger(value) && value >= 0 && value < question.choices.length);
  }
  function saveList(q, list) {
    attempts.set(idOf(q),list);
    if (storageAvailable) {
      try { localStorage.setItem(storageKey(q), JSON.stringify(list)); }
      catch { storageAvailable = false; }
    }
  }
  function hasDiagnosis(a) {
    // Old "unsure" records can enter the first check without rewriting their history.
    return a && (a.choice === unsure || Array.isArray(a.steps));
  }
  function getDiagnosis(q, a) {
    return diagnosisState(diagnosticProbes[idOf(q)], Array.isArray(a.steps) ? a.steps : []);
  }
  function retryOriginal(q) {
    retrying.add(idOf(q));
    visited.set(idOf(q), {choice:null,doubt:false});
    renderQuestion();
    find("question").focus();
  }
  function checkSummary(step, check) {
    const label = check.choice === unsure ? "我不确定" : step.choices[check.choice];
    const outcome = check.choice === unsure ? "还没有把握"
      : check.correct ? (check.repeated ? "✓ 看过此题讲解后答对" : "✓ 这一步答对") : "这一步答错";
    return step.skill + " · " + label + "（" + outcome + "）" + (check.still ? " · 看过讲解后仍有疑问" : "");
  }
  function renderDiagnosis(q, a) {
    const panel = find("diagnosis");
    panel.replaceChildren();
    panel.hidden = a.choice === q.correct && !a.doubt && !hasDiagnosis(a);
    if (panel.hidden) return;
    const steps = diagnosticProbes[idOf(q)];
    const state = getDiagnosis(q, a);
    const step = state.step;
    const active = hasDiagnosis(a);
    function line(tag, text) {
      const el = document.createElement(tag);
      mathText(el, text);
      panel.append(el);
      return el;
    }
    function action(label, name, handler, isChoice = false) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.dataset[isChoice ? "choice" : "action"] = String(name);
      mathText(btn, label);
      btn.onclick = handler;
      panel.append(btn);
    }
    function record(act) {
      const list = storageAvailable ? readAttempts(q) : attempts.get(idOf(q));
      const last = list.at(-1);
      if (!last || JSON.stringify(last) !== JSON.stringify(a)) {
        attempts.set(idOf(q),list);
        visited.delete(idOf(q));
        renderQuestion();
        return;
      }
      last.steps = [...(last.steps || [])];
      if (act !== "start") last.steps.push(act);
      saveList(q,list);
      if (getDiagnosis(q,last).phase === "retry") { retryOriginal(q); return; }
      refreshOverview();
      showFeedback(q,last);
      find("diagnosis").focus({preventScroll:true});
    }
    if (!active) {
      action("我还不懂，分步分析", "start", () => record("start"));
      if (a.choice !== q.correct && q.followUp?.choice !== a.choice)
        action("回原题再试", "retry", () => retryOriginal(q));
      return;
    }
    if (state.phase === "ask") {
      const previous = state.checks.at(-1);
      if (previous) line("small", previous.correct && !previous.still
        ? "✓ 上一步答对 · " + previous.step.skill
        : "上一步需要帮助 · " + previous.step.skill);
      line("h5", step.skill);
      line("p", step.prompt);
      step.choices.forEach((choice,i) => action(choice,i,() => record(i),true));
      action("这一步我也不确定", unsure, () => record(unsure),true);
    } else if (state.phase === "explain") {
      const check = state.checks.at(-1);
      line("h5", check.choice === unsure ? "一起看这一步" : check.correct ? "✓ 这一步答对了" : "核对这一步");
      line("p", checkSummary(step,check));
      line("p", step.explain);
      const next = diagnosisState(steps,[...(a.steps || []),"continue"]);
      const label = next.phase === "teacher" ? "记下要请老师看的这一步"
        : next.phase === "retry" ? "回到原题，自己再试"
        : next.level < state.level ? "先查前面的一步"
        : state.level === 0 && !check.correct ? "看懂了，试着用一次" : "试下一小步";
      action(label,"continue",() => record("continue"));
      action("看了还是不懂","still",() => record("still"));
    } else if (state.phase === "teacher") {
      line("h5", "把这一步带给老师");
      line("p", "我在「" + step.skill + "」这一步需要帮助。");
      line("p", step.prompt);
      line("small", "这次的选择和讲解已列入「回顾我的作答」，可以和老师一起看。");
      if (typeof trialGraphTargets !== "undefined") {
        const params = new URLSearchParams(trialGraphTargets[idOf(q)]);
        const link = document.createElement("a");
        link.href = "graph/dist/index.html#" + params;
        link.textContent = "查看本题的图谱知识点 · " + q.ref;
        panel.append(link);
      }
      action("回到原题，自己再试","retry",() => record("retry"));
    }
  }
  function readAttempts(question) {
    try {
      const raw = JSON.parse(localStorage.getItem(storageKey(question)) || "[]");
      return Array.isArray(raw) ? raw.filter((a) => a && validChoice(a.choice, question) && typeof a.doubt === "boolean") : [];
    } catch {
      storageAvailable = false;
      return attempts.get(idOf(question)) || [];
    }
  }
  function refreshAttempts() {
    if (storageAvailable) {
      questions.forEach((q) => attempts.set(idOf(q), readAttempts(q)));
    }
  }
  function attemptLabel(question, attempt) {
    if (attempt.choice === unsure) return "我不确定";
    return labels[attempt.choice] + (attempt.doubt ? " · 不确定" : "");
  }
  function feedback(question, attempt) {
    if (attempt.choice === unsure) {
      return { title: "一起拆开这道题", text: question.hint };
    }
    if (attempt.choice === question.correct) {
      const title = attempt.afterHelp ? "✓ 求助后，原题答对了" : attempt.doubt ? "✓ 选对了，再核对你的理由" : "✓ 选对了";
      return { title, text: question.choices[attempt.choice][1] };
    }
    if (question.followUp?.choice === attempt.choice && !Number.isInteger(attempt.probeChoice)) {
      return {title: "再看一步", text: "先核对下面这一步。"};
    }
    return { title: "回到这一步，再试一次", text: question.choices[attempt.choice][1] };
  }
  function showFeedback(question, attempt) {
    const box = find("feedback");
    if (!attempt) { box.hidden = true; return; }
    const f = feedback(question, attempt);
    find("feedback-title").textContent = f.title;
    mathText(find("feedback-text"), f.text);
    const review = find("review-skill");
    review.hidden = true;
    if (attempt.afterHelp && attempt.choice === question.correct) {
      const list = attempts.get(idOf(question)) || [];
      const previous = list.slice(0,-1).findLast(hasDiagnosis);
      if (previous) {
        const gap = getDiagnosis(question,previous).checks.findLast(check => !check.correct || check.still);
        if (gap) {
          mathText(review, "刚才需要帮助的一步 · " + gap.step.skill);
          review.hidden = false;
        }
      }
    }
    if (hasDiagnosis(attempt)) find("follow-up").hidden = true;
    else renderProbe(question, attempt);
    renderDiagnosis(question, attempt);
    const note = find("confidence-text");
    note.hidden = !attempt.doubt || attempt.choice === unsure;
    note.textContent = note.hidden ? "" : "你的不确定标记已记入本次作答。";
    box.dataset.outcome = attempt.choice === question.correct ? "correct" : "hint";
    find("next").textContent = index < questions.length - 1 ? "下一题 →" : "回顾作答 ↓";
    find("next").hidden = attempt.choice !== question.correct || hasDiagnosis(attempt);
    box.hidden = false;
  }
  function refreshOverview() {
    let count = 0;
    let solved = 0;
    const content = find("history-content");
    content.replaceChildren();
    const navButtons = [...find("question-nav").children];
    questions.forEach((q, i) => {
      const list = attempts.get(idOf(q)) || [];
      const last = list.at(-1);
      const answered = last?.choice === q.correct;
      navButtons[i].toggleAttribute("data-answered", Boolean(answered));
      navButtons[i].toggleAttribute("data-pending", Boolean(last && !answered));
      navButtons[i].setAttribute("aria-label", q.ref + " " + q.title + (answered ? "，原题答对" : last ? "，待回看" : "，未作答"));
      if (answered) solved++;
      if (!list.length) return;
      count++;
      const h = document.createElement("h4");
      h.textContent = q.ref + "　" + q.title;
      content.append(h);
      const ol = document.createElement("ol");
      list.forEach((item) => {
        const entry = document.createElement("li");
        const choice = document.createElement("strong");
        mathText(choice, attemptLabel(q, item) + (item.choice === unsure ? "" : "　" + q.choices[item.choice][0]));
        const p = document.createElement("p");
        const f = feedback(q, item);
        mathText(p, f.title + "。 " + f.text);
        entry.append(choice, p);
        if (q.followUp?.choice === item.choice && (!hasDiagnosis(item) || Number.isInteger(item.probeChoice))) {
          const record = document.createElement("p");
          const details = Number.isInteger(item.probeChoice)
            ? "我的回答：" + q.followUp.choices[item.probeChoice] + (item.probeChoice === q.followUp.correct ? "（正确）。" : "（需再核对）。") + q.followUp.explanation
            : "尚未回答。";
          mathText(record, "追问：" + q.followUp.prompt + "　" + details);
          entry.append(record);
        }
        if (hasDiagnosis(item)) {
          const state = getDiagnosis(q,item);
          const trail = document.createElement("ul");
          for (const check of state.checks) {
            const step = check.step;
            const result = document.createElement("li");
            mathText(result,checkSummary(step,check));
            const explanation = document.createElement("p");
            mathText(explanation,step.explain);
            result.append(explanation);
            trail.append(result);
          }
          if (trail.childElementCount) entry.append(trail);
          const note = document.createElement("p");
          const referred = item.steps?.includes("retry") || state.phase === "teacher";
          if (referred) note.textContent = "带给老师的问题 · " + state.step.skill;
          else if (state.phase === "retry") note.textContent = "已回到原题重试。";
          else if (item === last) note.textContent = "当前核对 · " + state.step.skill;
          if (note.textContent) entry.append(note);
        }
        ol.append(entry);
      });
      content.append(ol);
    });
    find("progress").textContent = "原题答对 " + solved + " / " + questions.length + (count > solved ? " · 待回看 " + (count - solved) : "");
    if (!count) content.textContent = "完成第一次作答后，可以在这里回看所选答案、当时的把握和反馈。";
    find("reset").hidden = !count;
    find("storage-note").textContent = storageAvailable
      ? "作答保存在当前浏览器。"
      : "此浏览器暂时无法保存记录，当前页面仍可回顾作答。";
  }
  function selectedChoice() {
    const item = find("choices").querySelector("input:checked");
    return item ? (item.value === unsure ? unsure : Number(item.value)) : null;
  }
  function syncForm() {
    const selected = selectedChoice();
    const checkbox = find("low-confidence");
    checkbox.disabled = selected === null || selected === unsure;
    if (checkbox.disabled) checkbox.checked = false;
    find("submit").disabled = selected === null;
    find("submit").hidden = selected === unsure;
    const q = questions[index];
    const staged = { choice: selected, doubt: checkbox.checked };
    visited.set(idOf(q), staged);
    const last = (attempts.get(idOf(q)) || []).at(-1);
    showFeedback(q, !retrying.has(idOf(q)) && last && last.choice === staged.choice && last.doubt === staged.doubt ? last : null);
  }
  function addChoice(text, value, selected) {
    const row = document.createElement("label");
    row.className = value === unsure ? "option unsure" : "option";
    const input = document.createElement("input");
    input.type = "radio";
    input.name = "answer";
    input.value = String(value);
    input.checked = selected === value;
    const marker = document.createElement("span");
    marker.className = "option-letter";
    marker.textContent = value === unsure ? "?" : labels[value];
    marker.setAttribute("aria-hidden", "true");
    const title = document.createElement("span");
    mathText(title, text);
    title.className = "option-text";
    if (value !== unsure) title.lang = "en";
    row.append(input, marker, title);
    find("choices").append(row);
  }
  function renderQuestion() {
    const q = questions[index];
    const last = (attempts.get(idOf(q)) || []).at(-1);
    if (!visited.has(idOf(q)) && hasDiagnosis(last) && getDiagnosis(q,last).phase === "retry") retrying.add(idOf(q));
    const current = visited.get(idOf(q)) || (retrying.has(idOf(q)) ? null : last);
    const retryNote = find("retry-note");
    retryNote.hidden = !retrying.has(idOf(q));
    find("task-label").textContent = q.ref + "　/　" + q.title;
    mathText(find("question"), q.prompt);
    mathText(find("support"), q.support);
    find("translation").open = false;
    const issue = new URL("https://github.com/phytnesskun/A-Level-Atlas/issues/new");
    issue.searchParams.set("title", topic.title + " · " + q.ref + " · " + q.title);
    issue.searchParams.set("body", "课程：" + topic.label + " · " + topic.edition + "\n题目：" + idOf(q) + "\n我想反馈的题干、选项或追问：\n");
    find("question-feedback").href = issue.href;
    renderFigure(q);
    find("choices").querySelectorAll("label").forEach((label) => label.remove());
    q.choices.forEach(([text], i) => addChoice(text, i, current?.choice));
    addChoice("我不确定", unsure, current?.choice);
    find("low-confidence").checked = current?.doubt || false;
    [...find("question-nav").children].forEach((link, i) => {
      if (i === index) link.setAttribute("aria-current", "step");
      else link.removeAttribute("aria-current");
    });
    syncForm();
    refreshOverview();
  }
  function readHash(scroll, focus = false) {
    const hash = location.hash.slice(1);
    const group = studyTopics.find((t) => t.questions.some((q) => idOf(q) === hash));
    if (!group) return;
    if (group !== topic) selectTopic(group);
    index = questions.findIndex((q) => idOf(q) === hash);
    renderQuestion();
    if (scroll) {
      if (focus) find("question").focus({preventScroll:true});
      find("practice").scrollIntoView({block:"start"});
    }
  }
  function selectTopic(nextTopic) {
    topic = nextTopic;
    questions = topic.questions;
    index = 0;
    find("edition").textContent = topic.label + "　/　" + topic.edition;
    find("practice-name").textContent = topic.title;
    find("history").open = false;
    const list = find("question-nav");
    list.replaceChildren();
    questions.forEach((q) => {
      const a = document.createElement("a");
      a.href = "#" + idOf(q);
      const ref = document.createElement("small"); ref.textContent = q.ref;
      const title = document.createElement("span"); title.textContent = q.title;
      a.append(ref, title);
      list.append(a);
    });
    [...find("topic-cards").children].forEach((a,i) => {
      if (studyTopics[i] === topic) a.setAttribute("aria-current", "true");
      else a.removeAttribute("aria-current");
    });
    refreshAttempts();
  }
  for (const t of studyTopics) {
    const card = document.createElement("a");
    card.href = "#" + idOf(t.questions[0]);
    const label = document.createElement("small"); label.textContent = t.label;
    const title = document.createElement("strong"); title.textContent = t.title;
    const meta = document.createElement("span"); meta.textContent = t.questions.length + " 道题 · 约 " + t.minutes + " 分钟";
    card.append(label, title, meta);
    find("topic-cards").append(card);
  }
  for (const id of ["topic-cards", "question-nav"]) {
    find(id).addEventListener("click", event => {
      const link = event.target.closest("a[href]");
      if (link && link.hash === location.hash) {
        event.preventDefault();
        readHash(true, true);
      }
    });
  }
  selectTopic(studyTopics[0]);
  renderQuestion();
  window.addEventListener("hashchange", () => readHash(true, true));
  readHash(true);
  window.addEventListener("storage", (event) => {
    if (event.key === null || event.key.startsWith(keyPrefix)) {
      refreshAttempts();
      const q = questions[index];
      if (event.key === null || event.key === storageKey(q)) {
        retrying.delete(idOf(q));
        visited.delete(idOf(q));
        renderQuestion();
      } else refreshOverview();
    }
  });
  find("choices").addEventListener("change", () => {
    syncForm();
    if (selectedChoice() === unsure) find("answer-form").requestSubmit();
  });
  find("low-confidence").addEventListener("change", syncForm);
  find("answer-form").addEventListener("submit", (event) => {
    event.preventDefault();
    const q = questions[index], choice = selectedChoice();
    if (choice === null) return;
    const answer = {choice, doubt: find("low-confidence").checked};
    const list = storageAvailable ? readAttempts(q) : (attempts.get(idOf(q)) || []);
    const last = list.at(-1);
    if (retrying.delete(idOf(q)) || !last || last.choice !== answer.choice || last.doubt !== answer.doubt) {
      if (list.some(a => hasDiagnosis(a) || a.choice !== q.correct)) answer.afterHelp = true;
      if (choice === unsure) answer.steps = [];
      list.push(answer);
      saveList(q,list);
    }
    attempts.set(idOf(q), list);
    find("retry-note").hidden = true;
    refreshOverview();
    showFeedback(q, list.at(-1));
    find("feedback").scrollIntoView({block:"nearest"});
  });
  find("next").addEventListener("click", () => {
    if (index < questions.length - 1) location.hash = idOf(questions[index + 1]);
    else {
      find("history").open = true;
      find("history").querySelector("summary").focus();
    }
  });
  find("reset").addEventListener("click", () => {
    if (!confirm("清空本组的作答记录并从第一题重新开始？")) return;
    questions.forEach((q) => {
      try { localStorage.removeItem(storageKey(q)); } catch { storageAvailable = false; }
    });
    for (const q of questions) { attempts.delete(idOf(q)); visited.delete(idOf(q)); retrying.delete(idOf(q)); }
    find("history").open = false;
    index = 0;
    renderQuestion();
    location.hash = idOf(questions[0]);
    find("practice").scrollIntoView({block:"start"});
  });
})();

</script>
</body>
</html>
